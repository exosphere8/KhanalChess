name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t khanalchess:ci .
      - name: Start container
        run: docker run -d --name kc-smoke -p 8000:8000 khanalchess:ci
      - name: Smoke test /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthx; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "/health did not answer within 60 s"
          docker logs kc-smoke
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f kc-smoke

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  publish:
    needs: [test, docker, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/exosphere8/khanalchess
          docker build --label "org.opencontainers.image.source=https://github.com/exosphere8/KhanalChess" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
